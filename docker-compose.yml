# Runs the EverMind web app. The database is Cloud Firestore (Firebase); nothing to run locally for it.
#   cp apps/web/docker.env.example apps/web/docker.env   (then fill in the values, including FIREBASE_*)
#   docker compose up -d --build
# The app is then on http://localhost:3000.
services:
  web:
    build: ./apps/web
    restart: unless-stopped
    env_file: ./apps/web/docker.env
    ports:
      - "3000:3000"

# Runs EverMind with its own MongoDB:
#   cp apps/web/docker.env.example apps/web/docker.env   (then fill in the values)
#   docker compose up -d --build
# The app is then on http://localhost:3000. Data lives in the "mongo-data" volume.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: ./apps/web/docker.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/evermind
    ports:
      - "3000:3000"

volumes:
  mongo-data:
